name: Deploy naar Azure Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Python 3.12 instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Afhankelijkheden installeren
        run: pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Inloggen bij Azure
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Omgevingsvariabelen instellen in Azure
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az functionapp config appsettings set \
              --name grovia-automations \
              --resource-group greit-resources \
              --settings \
                IXLY_BASE_URL="${{ secrets.IXLY_BASE_URL }}" \
                IXLY_CLIENT_ID="${{ secrets.IXLY_CLIENT_ID }}" \
                IXLY_CLIENT_SECRET="${{ secrets.IXLY_CLIENT_SECRET }}" \
                IXLY_ORGANIZATION_UUID="${{ secrets.IXLY_ORGANIZATION_UUID }}" \
                IXLY_REDIRECT_URI="${{ secrets.IXLY_REDIRECT_URI }}" \
                MOLLIE_API_KEY="${{ secrets.MOLLIE_API_KEY }}" \
                MOLLIE_REDIRECT_URL="${{ secrets.MOLLIE_REDIRECT_URL }}" \
                MOLLIE_WEBHOOK_URL="${{ secrets.MOLLIE_WEBHOOK_URL }}" \
                IXLY_AANMELDING_URL="${{ secrets.IXLY_AANMELDING_URL }}" \
                GROVIA_WORDPRESS_URL="${{ secrets.GROVIA_WORDPRESS_URL }}" \
                GROVIA_WOO_CONSUMER_KEY="${{ secrets.GROVIA_WOO_CONSUMER_KEY }}" \
                GROVIA_WOO_CONSUMER_SECRET="${{ secrets.GROVIA_WOO_CONSUMER_SECRET }}" \
                ACTION_TYPE_ENTRY_CODE_KA="${{ secrets.ACTION_TYPE_ENTRY_CODE_KA }}" \
                ACTION_TYPE_ENTRY_NAAM_KA="${{ secrets.ACTION_TYPE_ENTRY_NAAM_KA }}" \
                ACTION_TYPE_ENTRY_CODE_SU="${{ secrets.ACTION_TYPE_ENTRY_CODE_SU }}" \
                ACTION_TYPE_ENTRY_NAAM_SU="${{ secrets.ACTION_TYPE_ENTRY_NAAM_SU }}" \
                SMTP_HOST="${{ secrets.SMTP_HOST }}" \
                SMTP_PORT="${{ secrets.SMTP_PORT }}" \
                SMTP_GEBRUIKER="${{ secrets.SMTP_GEBRUIKER }}" \
                SMTP_WACHTWOORD="${{ secrets.SMTP_WACHTWOORD }}" \
                SMTP_AFZENDER="${{ secrets.SMTP_AFZENDER }}" \
                GROVIA_DEBUG_EMAIL="${{ secrets.GROVIA_DEBUG_EMAIL }}" \
                WHATSAPP_PHONE_NUMBER_ID="${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" \
                WHATSAPP_ACCESS_TOKEN="${{ secrets.WHATSAPP_ACCESS_TOKEN }}" \
                WHATSAPP_TEMPLATE_NAAM="${{ secrets.WHATSAPP_TEMPLATE_NAAM }}"

      - name: Deployen naar Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: grovia-automations
          package: .
          scm-do-build-during-deployment: false
