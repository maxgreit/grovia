---
openapi: 3.0.1
info:
  title: AssessmentPlatform API
  version: v1
  description: |
    ## API credentials

    Credentials for the API are created for your organization by Ixly Customer Support. After creation they will send them
    to you.

    ## Authorization

    The Ixly-API uses Oauth2 and supports 3 flows: Client Credentials Flow, managed organizations access grant and Device
    Authorization Flow, .<br>
    In the Client Credentials Flow, as used in this Swagger UI, client_id and client_secret are used to obtain a valid
    token,
    and with the current valid session (or after login to the application if necessary) a bearer-token is returned.
    If you only use the client_credentials, without the authorization code, we only know which api-application is used.
    You'll need to use the authorization code to get the user's identity.
    After that all API-requests are performed as that user.

    Using the managed organizations endpoint to obtain a grant token of an api user is also possible. This way
    authentication can be handled without the user's interaction. The grant token can be used to obtain an access token for
    the user. To
    start, use the client_credentials flow to obtain a token for the api application. Then use the managed organizations
    endpoint to select the organization you want to select an api user of. Use the organization id to fetch the managed
    organization details and to obtain a grant token for the user. With the grant token you can obtain an access token for
    the user. After that all API-requests are performed as that user.

    In the Device Authorization Flow another app, the Device App, makes a authorization-request with the client_id. Then a
    login/authorization-url is returned
    which can be used to login. The Device App is marked as authorized then. After login the Device App can poll for a valid
    bearer-token.

    See:

    - [Client Credentials Flow](https://auth0.com/docs/get-started/authentication-and-authorization-flow/client-credentials-flow)
    - [Device Authorization Flow](https://auth0.com/docs/get-started/authentication-and-authorization-flow/device-authorization-flow)

    ## Access and refresh tokens

    Access tokens have an expiry time, and should be refreshed before they expire. Refresh tokens are used to refresh access
    tokens. Upon the initial authorization on the token endpoint (a POST request to oauth/token) an access token and refresh
    token are returned. You should always use the latest access and refresh tokens for new requests.

    Normally you would use the token endpoint (oauth/token) to retrieve an access token by an authorization
    grant ([see example](https://github.com/doorkeeper-gem/doorkeeper/wiki/API-endpoint-descriptions-and-examples#curl-command-authorization-code-grant)).
    In this case we don't need the user to re-authorize the app, so we can use the refresh token to get a new access
    token ([see example](https://github.com/doorkeeper-gem/doorkeeper/wiki/API-endpoint-descriptions-and-examples#curl-command-refresh-token-grant)).

    Right now access token will have a very long lifetime, but we will change this in the future.
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: "/oauth/authorize"
          tokenUrl: "/oauth/token"
          scopes:
            public: Public access to the API
            private: Access to the private API
  schemas:
    assignment:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          candidate_uuid:
            type: string
            required: true
            description: Set the candidate of an assignment
          task_type:
            type: string
            required: true
            enum:
            - Process
            - Assessment
            - AssessmentProgram
            description: Set the task type of an assignment (Process, Assessment or
              AssessmentProgram)
          task_uuid:
            type: string
            required: true
            description: Set the task uuid of an assignment
          invited_at:
            type: string
            required: false
            description: 'Set the invite date of an assignment. We accept iso8601
              timestamps like this: 2025-01-01T12:00:00+01:00'
          mail_template_uuid:
            type: string
            required: false
            description: Set the mail_template uuid of an assignment
          reminder_mail_delivery_date:
            type: string
            required: false
            description: 'Set the reminder date of an assignment. We accept iso8601
              timestamps like this: 2025-01-01T12:00:00+01:00'
          reminder_mail_template_uuid:
            type: string
            required: false
            description: Set the reminder_mail_template uuid of an assignment
          deadline:
            type: string
            required: false
            description: 'Set the deadline of an assignment. We accept iso8601 timestamps
              like this: 2025-01-01T12:00:00+01:00'
          api_identifier:
            type: string
            required: false
            description: Set a custom unique identifier
        links:
          description: A resource object **MAY** contain references to other resource
            objects ("relationships"). Relationships may be to-one or to-many. Relationships
            can be specified by including a member in a resource's links object.
          type: object
          properties:
            login_url:
              type: string
              format: uri
              description: Let candidates directly login with using this URL.
            sign_up_url:
              type: string
              format: uri
              description: Let candidates create an account with using this URL.
            self:
              description: A `self` member, whose value is a URL for the relationship
                itself (a "relationship URL"). This URL allows the client to directly
                manipulate the relationship. For example, it would allow a client
                to remove an `author` from an `article` without deleting the people
                resource itself.
              type: string
              format: uri
            related:
              "$ref": "#/components/schemas/link"
          additionalProperties: true
    candidate:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          properties:
            last_name:
              type: string
              required: false
              description: Last name of the candidate
            first_name:
              type: string
              required: false
              description: First name of the candidate
            api_identifier:
              type: string
              required: false
              description: Api identifier of the candidate
            email:
              type: string
              required: false
              description: Email address of the candidate
            language:
              type: string
              required: false
              description: Language of the candidate
    candidate_feedback:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          properties:
            uuid:
              type: string
              description: Unique identifier of the candidate feedback
            state:
              type: string
              description: State of the candidate feedback
            completed_at:
              type: string
              format: date-time
              nullable: true
              description: When the feedback was completed
            report_to:
              type: string
              description: Who will receive the report (advisor, candidate or both)
            report_settings:
              type: object
              description: Settings for report generation
            created_at:
              type: string
              format: date-time
              description: When the feedback was created
            updated_at:
              type: string
              format: date-time
              description: When the feedback was last updated
    candidate_process:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          properties:
            uuid:
              type: string
              required: true
              description: Unique identifier of the candidate process
            status:
              type: string
              required: false
              description: Status of the candidate process
            title:
              type: string
              required: false
              description: Title of the candidate process
            finished_at:
              type: string
              required: false
              description: When was the candidate process finished
            started_at:
              type: string
              required: false
              description: When was the candidate process started
    candidate_program:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          properties:
            uuid:
              type: string
              required: true
              description: Unique identifier of the candidate program
            state:
              type: string
              required: false
              description: State of the candidate program
            completed_at:
              type: string
              required: false
              description: When was the candidate program completed
            started_at:
              type: string
              required: false
              description: When was the candidate program started
            report_to:
              type: string
              required: false
              description: Will the report send to the candidate, advisor or both
    candidate_task:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          properties:
            uuid:
              type: string
              required: true
              description: Unique identifier of the candidate task
            state:
              type: string
              required: false
              description: State of the candidate task
            completed_at:
              type: string
              required: false
              description: When was the candidate task completed
            started_at:
              type: string
              required: false
              description: When was the candidate task started
            report_to:
              type: string
              required: false
              description: Will the report send to the candidate, advisor or both
    feedback_template:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          properties:
            title:
              type: string
              nullable: false
              description: Title of the feedback template
            description:
              type: string
              description: Description of the feedback template
            language:
              type: string
              description: Language of the feedback template (e.g. 'en' or 'nl')
            report_example_url:
              type: string
              description: URL to an example report
            categories:
              type: array
              items:
                type: string
              description: Categories or tags linked to the template
            task_cms_url:
              type: string
              description: URL to the CMS entry of the feedback template
            created_at:
              type: string
              nullable: false
              description: The date and time the feedback template was created
            updated_at:
              type: string
              nullable: false
              description: The date and time the feedback template was last updated
    mail_template:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          properties:
            title:
              type: string
              nullable: false
              description: Title of the mail template
            subject:
              type: string
              nullable: false
              description: Subject of the mail template
            body:
              type: string
              description: Body of the mail template
            language:
              type: string
              description: language of the mail template
            application_template:
              type: boolean
              nullable: false
              description: Indicates if mail template is a application_template or
                a own mail template
            created_at:
              type: string
              nullable: false
              description: The date and time the label was created
            updated_at:
              type: string
              nullable: false
              description: The date and time the label was last updated
    media_item:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          properties:
            filename:
              type: string
              nullable: false
              description: Filename of the media item
            created_at:
              type: string
              nullable: false
              description: The date and time the media item was created
    organization:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          properties:
            name:
              type: string
              required: true
              description: Name of the organization
            language:
              type: string
              required: false
              description: Language of the organization
            uuid:
              type: string
              required: true
              description: Unique identifier of the organization
        links:
          description: A resource object **MAY** contain references to other resource
            objects ("relationships"). Relationships may be to-one or to-many. Relationships
            can be specified by including a member in a resource's links object.
          type: object
          properties:
            self:
              description: A `self` member, whose value is a URL for the relationship
                itself (a "relationship URL"). This URL allows the client to directly
                manipulate the relationship. For example, it would allow a client
                to remove an `author` from an `article` without deleting the people
                resource itself.
              type: string
              format: uri
            related:
              "$ref": "#/components/schemas/link"
          additionalProperties: true
    process:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          properties:
            title:
              type: string
              nullable: false
              description: Title of the process
            language:
              type: string
              nullable: true
              description: language of the process
            created_at:
              type: string
              nullable: false
              description: The date and time the process was created
            updated_at:
              type: string
              nullable: false
              description: The date and time the process was last updated
    program:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          properties:
            name:
              type: string
              nullable: false
              description: Name of the program
            description:
              type: string
              description: Description of the program
            language:
              type: string
              nullable: false
              description: language of the program
            categories:
              type: array
              nullable: false
              items:
                type: string
                description: Category of the program
                enum:
                - Adaptive
                - Intelligence
                - Personality
                - E-Assessment
                - Sample Tests
            api_identifier:
              type: string
              description: Api identifier of the program
        links:
          description: A resource object **MAY** contain references to other resource
            objects ("relationships"). Relationships may be to-one or to-many. Relationships
            can be specified by including a member in a resource's links object.
          type: object
          properties:
            example_report_url:
              type: string
              format: uri
              description: An example of report for this program
            self:
              description: A `self` member, whose value is a URL for the relationship
                itself (a "relationship URL"). This URL allows the client to directly
                manipulate the relationship. For example, it would allow a client
                to remove an `author` from an `article` without deleting the people
                resource itself.
              type: string
              format: uri
            related:
              "$ref": "#/components/schemas/link"
          additionalProperties: true
    respondent_group:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          properties:
            name:
              type: string
              required: true
              description: Name of the respondent group
            organization_id:
              type: integer
              required: true
              description: ID of the organization this group belongs to
            created_at:
              type: string
              required: true
              description: Timestamp when the respondent group was created
            updated_at:
              type: string
              required: true
              description: Timestamp when the respondent group was last updated
    task:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          properties:
            name:
              type: string
              nullable: false
              description: Name of the task
            description:
              type: string
              description: Description of the task
            language:
              type: string
              nullable: false
              description: Language of the task
            duration:
              type: string
              nullable: true
              description: Duration of the task
            categories:
              type: array
              nullable: false
              items:
                type: string
                description: Category of the task
                enum:
                - Adaptive
                - Game
                - Intelligence
                - Personality
                - Simulation
                - E-Assessment
                - Sample Tests
            assessable_after_finish:
              type: boolean
              nullable: false
              description: Task is assessable for a certain period
            provider:
              type: string
              nullable: true
              description: Shows the provider of the task
        links:
          description: A resource object **MAY** contain references to other resource
            objects ("relationships"). Relationships may be to-one or to-many. Relationships
            can be specified by including a member in a resource's links object.
          type: object
          properties:
            example_report_url:
              type: string
              format: uri
              description: An example of report for this task
            self:
              description: A `self` member, whose value is a URL for the relationship
                itself (a "relationship URL"). This URL allows the client to directly
                manipulate the relationship. For example, it would allow a client
                to remove an `author` from an `article` without deleting the people
                resource itself.
              type: string
              format: uri
            related:
              "$ref": "#/components/schemas/link"
          additionalProperties: true
    success:
      type: object
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/data"
        included:
          description: To reduce the number of HTTP requests, servers **MAY** allow
            responses that include related resources along with the requested primary
            resources. Such responses are called "compound documents".
          type: array
          items:
            "$ref": "#/components/schemas/resource"
          uniqueItems: true
        meta:
          "$ref": "#/components/schemas/meta"
        links:
          description: Link members related to the primary data.
          allOf:
          - "$ref": "#/components/schemas/links"
          - "$ref": "#/components/schemas/pagination"
        jsonapi:
          "$ref": "#/components/schemas/jsonapi"
      additionalProperties: false
    failure:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            "$ref": "#/components/schemas/error"
          uniqueItems: true
        meta:
          "$ref": "#/components/schemas/meta"
        jsonapi:
          "$ref": "#/components/schemas/jsonapi"
      additionalProperties: false
    info:
      type: object
      required:
      - meta
      properties:
        meta:
          "$ref": "#/components/schemas/meta"
        links:
          "$ref": "#/components/schemas/links"
        jsonapi:
          "$ref": "#/components/schemas/jsonapi"
      additionalProperties: false
    meta:
      description: Non-standard meta-information that can not be represented as an
        attribute or relationship.
      type: object
      additionalProperties: true
    data:
      description: The document's "primary data" is a representation of the resource
        or collection of resources targeted by a request.
      x-oneOf:
      - "$ref": "#/components/schemas/resource"
      - description: An array of resource objects, an array of resource identifier
          objects, or an empty array ([]), for requests that target resource collections.
        type: array
        items:
          "$ref": "#/components/schemas/resource"
        uniqueItems: true
      - description: null if the request is one that might correspond to a single
          resource, but doesn't currently.
        type: 'null'
    resource:
      description: '"Resource objects" appear in a JSON API document to represent
        resources.'
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
        id:
          type: string
        attributes:
          "$ref": "#/components/schemas/attributes"
        relationships:
          "$ref": "#/components/schemas/relationships"
        links:
          "$ref": "#/components/schemas/links"
        meta:
          "$ref": "#/components/schemas/meta"
      additionalProperties: false
    links:
      description: A resource object **MAY** contain references to other resource
        objects ("relationships"). Relationships may be to-one or to-many. Relationships
        can be specified by including a member in a resource's links object.
      type: object
      properties:
        self:
          description: A `self` member, whose value is a URL for the relationship
            itself (a "relationship URL"). This URL allows the client to directly
            manipulate the relationship. For example, it would allow a client to remove
            an `author` from an `article` without deleting the people resource itself.
          type: string
          format: uri
        related:
          "$ref": "#/components/schemas/link"
      additionalProperties: true
    link:
      description: 'A link **MUST** be represented as either: a string containing
        the link''s URL or a link object.'
      x-oneOf:
      - description: A string containing the link's URL.
        type: string
        format: uri
      - type: object
        required:
        - href
        properties:
          href:
            description: A string containing the link's URL.
            type: string
            format: uri
          meta:
            "$ref": "#/components/schemas/meta"
    attributes:
      description: Members of the attributes object ("attributes") represent information
        about the resource object in which it's defined.
      type: object
      patternProperties:
        "^(?!relationships$|links$)\\w[-\\w_]*$":
          description: Attributes may contain any valid JSON value.
      additionalProperties: false
    relationships:
      description: Members of the relationships object ("relationships") represent
        references from the resource object in which it's defined to other resource
        objects.
      type: object
      patternProperties:
        "^\\w[-\\w_]*$":
          properties:
            links:
              "$ref": "#/components/schemas/links"
            data:
              description: Member, whose value represents "resource linkage".
              x-oneOf:
              - "$ref": "#/components/schemas/relationshipToOne"
              - "$ref": "#/components/schemas/relationshipToMany"
            meta:
              "$ref": "#/components/schemas/meta"
          anyOf:
          - required:
            - data
          - required:
            - meta
          - required:
            - links
          additionalProperties: false
      additionalProperties: false
    relationshipToOne:
      description: References to other resource objects in a to-one ("relationship").
        Relationships can be specified by including a member in a resource's links
        object.
      anyOf:
      - "$ref": "#/components/schemas/empty"
      - "$ref": "#/components/schemas/linkage"
    relationshipToMany:
      description: An array of objects each containing "type" and "id" members for
        to-many relationships.
      type: array
      items:
        "$ref": "#/components/schemas/linkage"
      uniqueItems: true
    empty:
      description: Describes an empty to-one relationship.
      type: string
    linkage:
      description: The "type" and "id" to non-empty members.
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
        id:
          type: string
        meta:
          "$ref": "#/components/schemas/meta"
      additionalProperties: false
    pagination:
      type: object
      properties:
        first:
          description: The first page of data
          x-oneOf:
          - type: string
            format: uri
          - type: 'null'
        last:
          description: The last page of data
          x-oneOf:
          - type: string
            format: uri
          - type: 'null'
        prev:
          description: The previous page of data
          x-oneOf:
          - type: string
            format: uri
          - type: 'null'
        next:
          description: The next page of data
          x-oneOf:
          - type: string
            format: uri
          - type: 'null'
    jsonapi:
      description: An object describing the server's implementation
      type: object
      properties:
        version:
          type: string
        meta:
          "$ref": "#/components/schemas/meta"
      additionalProperties: false
    error:
      type: object
      properties:
        id:
          description: A unique identifier for this particular occurrence of the problem.
          type: string
        links:
          "$ref": "#/components/schemas/links"
        status:
          description: The HTTP status code applicable to this problem, expressed
            as a string value.
          type: string
        code:
          description: An application-specific error code, expressed as a string value.
          type: string
        title:
          description: A short, human-readable summary of the problem. It **SHOULD
            NOT** change from occurrence to occurrence of the problem, except for
            purposes of localization.
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of
            the problem.
          type: string
        source:
          type: object
          properties:
            pointer:
              description: A JSON Pointer [RFC6901] to the associated entity in the
                request document [e.g. "/data" for a primary data object, or "/data/attributes/title"
                for a specific attribute].
              type: string
            parameter:
              description: A string indicating which query parameter caused the error.
              type: string
        meta:
          "$ref": "#/components/schemas/meta"
      additionalProperties: false
servers:
- url: "/"
paths:
  "/api/public/assignments/{uuid}":
    get:
      summary: retrieve assignment
      description: retrieve candidate assignment by uuid
      security:
      - oauth2:
        - public
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: show the assignment
          content:
            application/json:
              example:
                data:
                  id: 9b9c1227-740b-46bb-93b4-7ca0c525c6b4
                  type: assignment
                  attributes:
                    invited_at: '2024-01-01T00:00:00.000Z'
                    deadline: '2026-01-01'
                    reminder_mail_delivery_date: '2025-01-01T00:00:00.000Z'
                    created_at: '2024-11-25T10:08:30.165Z'
                    updated_at: '2024-11-25T10:08:30.165Z'
                    api_identifier: api-identifier
                  relationships:
                    candidate:
                      data:
                        id: 5be8e20a-aeae-4234-b5b2-f2e4f6f49b86
                        type: candidate
                    mail_template:
                      data:
                        id: d5dfd982-c770-4629-9de6-367c4017c3fe
                        type: mail_templates
                    reminder_mail_template:
                      data:
                    candidate_task:
                      data:
                        id: d2991745-f5c3-42d1-8877-d3d3bbfbf004
                        type: candidate_task
                    candidate_program:
                      data:
                    candidate_process:
                      data:
                    candidate_feedback:
                      data:
                  links:
                    login_url: http://localhost:3000/candidates/token_authentications/new?token=eyJfcmFpbHMiOnsiZGF0YSI6WzExNjk4MywiMjAyNS0wMy0xMlQxNDozNjo0NS42NDgrMDE6MDAiXSwicHVyIjoiQ2FuZGlkYXRlXG50b2tlbl9hdXRoZW50aWNhdGlvblxuIn19--ece59278c2923b2f001afcae803c122f17acdcd7
                    sign_up_url: http://localhost:3000/candidates/confirmation?confirmation_token=S2VQoiyTrsV-YuDWkDAs&locale=en
              schema:
                type: object
                data:
                - "$ref": "#/components/schemas/assignment"
        '400':
